[workspace]
resolver = "2"
members = ["crates/fond-doc", "crates/fond-annot"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
authors = ["Cal St Francis <calstfrancis@gmail.com>"]
repository = "https://github.com/calstfrancis/fond-core"

[workspace.dependencies]
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
